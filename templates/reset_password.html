{% extends "base.html" %}
{% block title %}Choose a new password | FaceLedger{% endblock %}
{% block content %}<div class="center-panel">{% if invalid %}<div class="status-box error">This reset link is invalid or expired.</div>{% else %}<p class="eyebrow">ACCOUNT SECURITY</p><h1>Choose a new password</h1><form method="post" class="stack-form"><label>New password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="button primary" type="submit">Update password</button></form>{% endif %}</div>{% endblock %}
